[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Generated static HTML serves public routes directly. Admin remains client-rendered.
[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/work/quantum-machine-learning"
  to = "/work/emerging-technology-assessment"
  status = 301
[[redirects]]
  from = "/work/blockchain-emerging-technology"
  to = "/work/emerging-technology-assessment"
  status = 301
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
